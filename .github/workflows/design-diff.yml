name: Design diff

# Pull requests that change .pen files (nib's libraries, the app icon) get a comment with what changed.
on:
  pull_request:
    paths: ['**/*.pen']

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/design-diff
